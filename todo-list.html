<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Pastelería Gabriela</title>
    <link rel="stylesheet" href="todo-style.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <h1>📦 Pedidos - Pastelería Gabriela</h1>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Ej: Pastel de Chocolate para el 15/08" 
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="btn-add">➕ Agregar Pedido</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="active">Pendientes</button>
                <button class="filter-btn" data-filter="completed">Listos</button>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- Los pedidos se agregarán aquí dinámicamente -->
            </ul>

            <div class="stats">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Pendientes: <strong id="pendingCount">0</strong></span>
                <span>Listos: <strong id="completedCount">0</strong></span>
            </div>

            <button id="clearBtn" class="btn-clear">🗑️ Limpiar Entregados</button>
        </div>
    </div>

    <script src="todo-script.js"></script>
</body>
</html>
