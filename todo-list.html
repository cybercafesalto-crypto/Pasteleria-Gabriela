<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas - To-Do List</title>
    <link rel="stylesheet" href="todo-style.css">
</head>
<body>
    <div class="container">
        <div class="todo-wrapper">
            <h1>📋 Mi Lista de Tareas</h1>
            
            <div class="input-container">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Escribe una nueva tarea..." 
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="btn-add">➕ Agregar</button>
            </div>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="active">Activas</button>
                <button class="filter-btn" data-filter="completed">Completadas</button>
            </div>

            <ul id="todoList" class="todo-list">
                <!-- Las tareas se agregarán aquí dinámicamente -->
            </ul>

            <div class="stats">
                <span>Total: <strong id="totalCount">0</strong></span>
                <span>Completadas: <strong id="completedCount">0</strong></span>
                <span>Pendientes: <strong id="pendingCount">0</strong></span>
            </div>

            <button id="clearBtn" class="btn-clear">🗑️ Limpiar Completadas</button>
        </div>
    </div>

    <script src="todo-script.js"></script>
</body>
</html>
